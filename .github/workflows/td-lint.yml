name: TouchDesigner Lint

on:
  push:
    paths:
      - '**/*.toe.dir/**'
      - 'docs/touchdesigner/fixtures/projects/fixtures-expanded.zip'
      - 'src/td_linter/**'
    branches: [main, develop, feature/*]
  pull_request:
    paths:
      - '**/*.toe.dir/**'
      - 'docs/touchdesigner/fixtures/projects/fixtures-expanded.zip'
      - 'src/td_linter/**'
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger

jobs:
  lint:
    name: Lint TouchDesigner Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true  # Need fixtures-expanded.zip

      - name: Extract pre-expanded fixtures
        run: |
          cd docs/touchdesigner/fixtures/projects
          if [ -f fixtures-expanded.zip ]; then
            unzip -o fixtures-expanded.zip
            echo "Extracted $(ls -d *.toe.dir 2>/dev/null | wc -l) .toe.dir directories"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install td-linter
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Install glslang
        run: sudo apt-get install -y glslang-tools

      - name: Find and lint .toe.dir projects
        id: lint
        run: |
          source .venv/bin/activate

          # Initialize SARIF output
          echo '{"$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json", "version": "2.1.0", "runs": []}' > results.sarif

          EXIT_CODE=0
          HAS_RESULTS=false

          # Find all .toe.dir directories and lint each (handle spaces in names)
          while IFS= read -r -d '' dir; do
            echo "Linting: $dir"
            HAS_RESULTS=true

            # Run linter and capture output
            if OUTPUT=$(td-linter lint "$dir" --format sarif 2>&1); then
              echo "  OK"
            else
              echo "  Found violations"
              EXIT_CODE=1
            fi

            # Append run to results if output is valid SARIF
            if echo "$OUTPUT" | jq -e '.runs[0]' > /dev/null 2>&1; then
              RUN=$(echo "$OUTPUT" | jq '.runs[0]')
              jq --argjson run "$RUN" '.runs += [$run]' results.sarif > results.sarif.tmp
              mv results.sarif.tmp results.sarif
            fi
          done < <(find . -name '*.toe.dir' -type d -print0 2>/dev/null)

          if [ "$HAS_RESULTS" = "false" ]; then
            echo "No .toe.dir directories found to lint"
          fi

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "has_results=$HAS_RESULTS" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        # Only upload if we found and linted .toe.dir directories
        if: steps.lint.outputs.has_results == 'true'
        with:
          sarif_file: results.sarif
          category: td-linter

      - name: Fail if lint errors
        if: steps.lint.outputs.exit_code == '1'
        run: |
          echo "Linting failed with errors"
          exit 1
