[project]
name = "max-linter"
version = "0.1.0"
description = "LSP-based linter for Max/MSP GenExpr and GLSL shaders"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SevenRad" }]
dependencies = [
    "python-lsp-jsonrpc>=1.1.2",
    "networkx>=3.2",
    "lark>=1.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.11",
]
c-lint = [
    "libclang>=18.1.0",
]

[project.scripts]
max-lint = "max_linter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/max_linter"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
